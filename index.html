<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Sign Up Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Image side -->
    <div class="image-side">
      <!-- Top section -->
      <div class="image-side-top">
        <!-- Image header -->
        <div class="image-header">
          <img src="/assets/odin-lined.png" alt="The Odin Project Logo" />
          <div>Odin</div>
        </div>
      </div>

      <!-- Image credit -->
      <div class="image-side-bottom">
        <div>
          Photo by
          <a href="https://unsplash.com/@haliewestphoto">Halie West</a>
          on
          <a
            href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
          >
            Unsplash
          </a>
        </div>
      </div>
    </div>

    <!-- Form side -->
    <form action="#" method="post" class="form-side">
      <!-- Text above form -->
      <div class="form-text">
        <div>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up now
          to get started.
        </div>
        <div>You <i>know</i> you want to.</div>
      </div>
      <!-- Container for heading and form -->
      <div class="form-container">
        <div class="heading">Let's do this!</div>

        <div>
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" />
        </div>
        <div>
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" />
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
        </div>
        <div>
          <label for="phone_number">Phone Number</label>
          <input
            type="text"
            inputmode="numeric"
            id="phone_number"
            name="phone_number"
          />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" />
        </div>
        <div>
          <label for="confirm_password">Confirm Password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
          />
        </div>
      </div>

      <button type="submit">Create Account</button>
      <div>Already have an account? <a href="#">Log in</a></div>
    </form>
  </body>
</html>
