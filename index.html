<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Sign Up Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Image side -->
    <div class="image-side">
      <div>Odin</div>
      <div>
        Photo by Halie West on
        <a
          href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
        >
          Unsplash
        </a>
      </div>
    </div>

    <!-- Form side -->
    <div class="form-side">
      <div>
        This is not a real online service! You know you need something like this
        in your life to help you realize your deepest dreams. Sign up now to get
        started. You know you want to
      </div>
      <div>
        <div class="test">Let's do this!</div>
        <form action="#" method="post" class="form">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" />
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" />
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
          <label for="phone_number">Phone Number</label>
          <input
            type="text"
            inputmode="numeric"
            id="phone_number"
            name="phone_number"
          />
          <label for="password">Password</label>
          <input type="password" id="password" name="password" />
          <label for="confirm_password">Confirm Password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
          />
          <button type="submit">Create Account</button>
        </form>
      </div>
      <div>Already have an account? <a href="#">Log in</a></div>
    </div>
  </body>
</html>
